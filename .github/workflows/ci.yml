name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim:
    name: Sim tests and headless run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit, determinism and invariant tests
        run: npm run test:unit
      - name: Headless run (100x100, 6 civs, 2000 years) with throughput floor
        run: npm run perf
      - name: Every preset runs headlessly
        run: |
          for p in balanced archipelago drylands crowded; do
            node tools/headless.js --preset "$p" --ticks 500
          done

  browser:
    name: Browser smoke test (phone viewports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-artifacts/
          retention-days: 7
